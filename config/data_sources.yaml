AMO:
  name: Atlantic Multidecadal Oscillation (Kaplan SST)
  acronym: AMO
  institution: NOAA Physical Sciences Laboratory (PSL)
  url: https://psl.noaa.gov/data/correlation/amon.us.data
  filename_csv: dataAMO.csv
  filename_txt: dataAMO.txt
  format: monthly_matrix
  region: Atlántico Norte (0° a 70°N)
  variable: Anomalía de Temperatura Superficial del Mar sin tendencia (°C)
  variable_type: anomalía
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Anomalía mensual de TSM desestacionalizada y sin tendencia
    lineal (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.3
  description: Variabilidad multidecadal de la temperatura superficial del mar en
    el Atlántico Norte. Modula la actividad ciclónica tropical en la cuenca del Atlántico
    y los regímenes de precipitación estacional en Centroamérica.
  reference: Enfield, D. B., Mestas-Nuñez, A. M., & Trimble, P. J. (2001). The Atlantic
    Multidecadal Oscillation and its relation to rainfall and river flows in the continental
    U.S. Geophysical Research Letters, 28(10), 2077-2080.
  doi: 10.1029/2000GL012745
AO:
  name: Arctic Oscillation
  acronym: AO
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/monthly.ao.index.b50.current.ascii.table
  filename_csv: dataAO.csv
  filename_txt: dataAO.txt
  format: monthly_matrix
  region: Ártico / Hemisferio Norte (20°N a 90°N)
  variable: Anomalía de Geopotencial en 1000 hPa proyectada sobre el primer modo EOF
  variable_type: índice estandarizado
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Índice estandarizado mensual de oscilación ártica (adimensional)
  units: Estandarizado
  period_start: 1950
  update_frequency: Mensual
  missing_value: -999.0
  threshold_r: 0.4
  threshold_mad: 1.0
  description: Modo dominante de variabilidad de la circulación troposférica en latitudes
    medias y altas del Hemisferio Norte. Condiciona la intensidad del vórtice polar
    y la incursión de frentes fríos hacia Centroamérica durante la temporada seca.
  reference: Thompson, D. W., & Wallace, J. M. (1998). The Arctic Oscillation signature
    in the wintertime geopotential height and temperature fields. Geophysical Research
    Letters, 25(9), 1297-1300.
  doi: 10.1029/98GL00950
MEI:
  name: Multivariate ENSO Index Version 2
  acronym: MEI
  institution: NOAA Physical Sciences Laboratory (PSL)
  url: https://psl.noaa.gov/enso/mei/data/meiv2.data
  filename_csv: dataMEI_2.csv
  filename_txt: dataMEI_2.txt
  format: monthly_matrix
  region: Pacífico Tropical (30°S-30°N, 100°E-70°W)
  variable: Combinación multivariada EOF (SLP, SST, vientos zonales/meridionales,
    OLR)
  variable_type: índice estandarizado
  variable_column: ENE..DIC (Bimensual emparejado a meses)
  exact_variable_used: Índice multivariado estandarizado del acoplamiento océano-atmósfera
  units: Estandarizado
  period_start: 1950
  update_frequency: Bimensual / Mensual
  missing_value: -999.0
  threshold_r: 0.4
  threshold_mad: 0.5
  description: Índice multivariado que integra seis variables atmosféricas y oceánicas
    sobre el Pacífico Tropical para monitorear de forma holística el acoplamiento
    océano-atmósfera del fenómeno ENOS.
  reference: Zhang, T., Hoell, A., Perlwitz, J., Eischeid, J., Murray, D., & Wolter,
    K. (2019). The Multivariate ENSO Index Version 2. International Journal of Climatology,
    39(8), 3467-3482.
  doi: 10.1002/joc.6033
ONIv5:
  name: Oceanic Niño Index (ERSSTv5)
  acronym: ONIv5
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/oni/v5/
  filename_csv: dataONIv5.csv
  filename_txt: dataONIv5.txt
  format: seasonal_running_mean
  region: Pacífico Niño 3.4 (5°N-5°S, 120°-170°W)
  variable: Media móvil trimestral de Anomalía TSM ERSST.v5 (°C)
  variable_type: anomalía
  variable_column: DJF..NDJ (Medias móviles centradas ERSST.v5)
  exact_variable_used: Anomalía térmica trimestral calculada a partir de ERSSTv5 (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Versión histórica de referencia del ONI calculada con el producto de
    temperatura superficial del mar ERSST versión 5 de NOAA con climatología base
    de 30 años centrada.
  reference: Huang, B., Thorne, P. W., et al. (2017). Extended Reconstructed Sea Surface
    Temperature, Version 5 (ERSSTv5). Journal of Climate, 30(20), 8179-8205.
  doi: 10.1175/JCLI-D-16-0836.1
ONIv6:
  name: Oceanic Niño Index (ERSSTv6)
  acronym: ONIv6
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/oni/v6/
  filename_csv: dataONIv6.csv
  filename_txt: dataONIv6.txt
  format: seasonal_running_mean
  region: Pacífico Niño 3.4 (5°N-5°S, 120°-170°W)
  variable: Media móvil trimestral de Anomalía TSM ERSST.v6 (°C)
  variable_type: anomalía
  variable_column: DJF..NDJ (Medias móviles centradas ERSST.v6)
  exact_variable_used: Anomalía térmica trimestral calculada a partir de ERSSTv6 (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Nueva versión oficial del ONI basada en la reconstrucción ERSST versión
    6, que incorpora correcciones avanzadas en bias de boyas y altimetría satelital.
  reference: 'Huang, B., et al. (2025). Extended Reconstructed Sea Surface Temperature,
    Version 6 (ERSSTv6): Upgrades and Intercomparisons. Journal of Climate, 38(4),
    945-965.'
  doi: 10.1175/JCLI-D-23-0707.1
RONI:
  name: Relative Oceanic Niño Index (ERSSTv6)
  acronym: RONI
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/
  filename_csv: dataRONI.csv
  filename_txt: dataRONI.txt
  format: seasonal_running_mean
  region: Pacífico Niño 3.4 relativo a la media del cinturón tropical (20°N-20°S)
  variable: Anomalía relativa de TSM Niño 3.4 menos la anomalía media tropical global
    (°C)
  variable_type: índice derivado
  variable_column: DJF..NDJ (Media trimestral relativa ajustada)
  exact_variable_used: Anomalía relativa trimestral ajustada por la varianza del calentamiento
    global de fondo (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Índice de NOAA CPC que descuenta el calentamiento global homogéneo
    de los trópicos para aislar el gradiente zonal neto y el verdadero forzamiento
    convectivo del ENOS.
  reference: Van Oldenborgh, G. J., et al. (2021). Pathways of global warming impacts
    on ENSO teleconnections. Journal of Climate, 34(7), 2633-2647.
  doi: 10.1175/JCLI-D-20-0588.1
NAO:
  name: North Atlantic Oscillation
  acronym: NAO
  institution: NOAA Climate Prediction Center (CPC) / PSL
  url: https://psl.noaa.gov/data/correlation/nao.data
  filename_csv: dataNAO.csv
  filename_txt: dataNAO.txt
  format: monthly_matrix
  region: Atlántico Norte (Baja de Islandia vs Alta de Azores)
  variable: Diferencia de presión a nivel del mar normalizada
  variable_type: índice estandarizado
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Índice de teleconexión estandarizado de la Oscilación del Atlántico
    Norte
  units: Estandarizado
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.9
  threshold_r: 0.5
  threshold_mad: 0.6
  description: Dipolo de presión atmosférica entre la Baja de Islandia y el Anticiclón
    de las Azores. Modula la trayectoria de borrascas atlánticas, la intensidad de
    los vientos alisios y el flujo de humedad hacia el Caribe.
  reference: 'Hurrell, J. W. (1995). Decadal trends in the North Atlantic Oscillation:
    regional temperatures and precipitation. Science, 269(5224), 676-679.'
  doi: 10.1126/science.269.5224.676
PDO:
  name: Pacific Decadal Oscillation
  acronym: PDO
  institution: NOAA National Centers for Environmental Information (NCEI) / PSL
  url: https://psl.noaa.gov/data/correlation/pdo.data
  filename_csv: dataPDO.csv
  filename_txt: dataPDO.txt
  format: monthly_matrix
  region: Pacífico Norte (al norte de 20°N)
  variable: Primer modo EOF de anomalías mensuales de TSM en el Pacífico Norte
  variable_type: índice estandarizado
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Serie temporal del componente principal EOF1 estandarizado
  units: Estandarizado
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Patrón recurrente de variabilidad oceánica en el Pacífico Norte con
    fases de 20 a 30 años. Interactúa constructiva o destructivamente con el ENOS
    modulando sus impactos hidroclimáticos en el istmo centroamericano.
  reference: Mantua, N. J., Hare, S. R., Zhang, Y., Wallace, J. M., & Francis, R.
    C. (1997). A Pacific interdecadal climate oscillation with impacts on salmon production.
    Bulletin of the American Meteorological Society, 78(6), 1069-1079.
  doi: 10.1175/1520-0477(1997)078<1069:APICOW>2.0.CO;2
TNA:
  name: Tropical Northern Atlantic Index
  acronym: TNA
  institution: NOAA Physical Sciences Laboratory (PSL)
  url: https://psl.noaa.gov/data/correlation/tna.data
  filename_csv: dataTNA.csv
  filename_txt: dataTNA.txt
  format: monthly_matrix
  region: Atlántico Tropical Norte (5.5°N a 23.5°N, 15°W a 57.5°W)
  variable: Anomalía promedio de Temperatura Superficial del Mar (°C)
  variable_type: anomalía
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Anomalía promedio de TSM en la cuenca del Atlántico Tropical
    Norte (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.3
  description: Anomalía de temperatura superficial del mar en el sector tropical del
    Atlántico Norte. Es un forzante directo del flujo de humedad monzónico y de la
    posición latitudinal de la Zona de Convergencia Intertropical (ZCIT).
  reference: 'Enfield, D. B., & Alfaro, E. J. (1999). The conundrum of the warm pool
    in the tropical Western Hemisphere: How its SST anomalies modulate rainfall in
    Central and South America. Journal of Climate, 12(4), 1057-1075.'
  doi: 10.1175/1520-0442(1999)012<1057:TCOTWP>2.0.CO;2
SSTA_12:
  name: Niño 1+2 SST Anomaly
  acronym: SSTA_12
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices
  filename_csv: dataSSTA_12.csv
  filename_txt: dataSSTA.txt
  format: monthly_composite
  region: Costas de Ecuador y Perú (0°-10°S, 90°-80°W)
  variable: Anomalía mensual de Temperatura Superficial del Mar ERSST (°C)
  variable_type: anomalía
  variable_column: ANOM1+2 (Columna de anomalía extraída de sstoi.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Anomalía térmica costera en el extremo oriental del Pacífico Ecuatorial.
    Fundamental para detectar eventos de 'El Niño Costero' que impactan intensamente
    los regímenes pluviométricos regionales.
  reference: Reynolds, R. W., Rayner, N. A., Smith, T. M., Stokes, D. C., & Wang,
    W. (2002). An improved in situ and satellite SST analysis for climate. Journal
    of Climate, 15(13), 1609-1625.
  doi: 10.1175/1520-0442(2002)015<1609:AIISAS>2.0.CO;2
SSTA_3:
  name: Niño 3 SST Anomaly
  acronym: SSTA_3
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices
  filename_csv: dataSSTA_3.csv
  filename_txt: dataSSTA.txt
  format: monthly_composite
  region: Pacífico Oriental Ecuatorial (5°N-5°S, 150°W-90°W)
  variable: Anomalía mensual de Temperatura Superficial del Mar ERSST (°C)
  variable_type: anomalía
  variable_column: ANOM3 (Columna de anomalía extraída de sstoi.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Anomalía térmica en el sector oriental del Pacífico. Refleja la amplitud
    de la variabilidad interanual del modo canónico de El Niño (El Niño Oriental /
    EP).
  reference: Trenberth, K. E. (1997). The definition of El Niño. Bulletin of the American
    Meteorological Society, 78(12), 2771-2778.
  doi: 10.1175/1520-0477(1997)078<2771:TDOEN>2.0.CO;2
SSTA_4:
  name: Niño 4 SST Anomaly
  acronym: SSTA_4
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices
  filename_csv: dataSSTA_4.csv
  filename_txt: dataSSTA.txt
  format: monthly_composite
  region: Pacífico Centro-Occidental Ecuatorial (5°N-5°S, 160°E-150°W)
  variable: Anomalía mensual de Temperatura Superficial del Mar ERSST (°C)
  variable_type: anomalía
  variable_column: ANOM4 (Columna de anomalía extraída de sstoi.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Anomalía térmica en la piscina cálida del Pacífico occidental. Es el
    índice de referencia para monitorear eventos de 'El Niño Modoki' o de calentamiento
    central (CP).
  reference: 'Ashok, K., Behera, S. K., Rao, S. A., Weng, H., & Yamagata, T. (2007).
    El Niño Modoki and its possible teleconnection. Journal of Geophysical Research:
    Oceans, 112(C11).'
  doi: 10.1029/2006JC003798
SSTA_34:
  name: Niño 3.4 SST Anomaly
  acronym: SSTA_34
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices
  filename_csv: dataSSTA_34.csv
  filename_txt: dataSSTA.txt
  format: monthly_composite
  region: Pacífico Centro-Oriental Ecuatorial (5°N-5°S, 170°W-120°W)
  variable: Anomalía mensual de Temperatura Superficial del Mar ERSST (°C)
  variable_type: anomalía
  variable_column: ANOM3.4 (Columna de anomalía extraída de sstoi.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.6
  description: Región central de acoplamiento atmósfera-océano para la definición
    internacional del ciclo ENOS. Clave para el análisis de años análogos estacionales.
  reference: Barnston, A. G., Chelliah, M., & Goldenberg, S. B. (1997). Documentation
    of a highly ENSO-related SST region in the equatorial Pacific. Atmosphere-Ocean,
    35(3), 367-383.
  doi: 10.1080/07055900.1997.9649597
AtlTROP:
  name: Tropical Atlantic SST Anomaly
  acronym: AtlTROP
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.atl.indices
  filename_csv: dataAtlTROP.csv
  filename_txt: dataSSTOI.txt
  format: monthly_composite
  region: Atlántico Tropical Global (20°N-20°S, 100°W-20°E)
  variable: Anomalía mensual de Temperatura Superficial del Mar (°C)
  variable_type: anomalía
  variable_column: ANOM_TROP (Columna de anomalía extraída de sstoi.atl.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.4
  description: Promedio de anomalías de temperatura superficial en toda la franja
    tropical del Atlántico. Controla el contenido de calor y la convección profunda
    tropical.
  reference: Servain, J. (1991). Simple climatic indices for the tropical Atlantic
    Ocean and some applications. Tellus A, 43(1), 59-71.
  doi: 10.3402/tellusa.v43i1.11913
SAtl:
  name: South Atlantic SST Anomaly
  acronym: SAtl
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.atl.indices
  filename_csv: dataSAtl.csv
  filename_txt: dataSSTOI.txt
  format: monthly_composite
  region: Atlántico Sur Tropical (0°-20°S, 40°W-20°E)
  variable: Anomalía mensual de Temperatura Superficial del Mar (°C)
  variable_type: anomalía
  variable_column: ANOM_SAtl (Columna de anomalía extraída de sstoi.atl.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.4
  description: Anomalía térmica en el Atlántico Tropical Sur. Modula el gradiente
    meridional interhemisférico (dipolo atlántico) y la posición meridional de la
    ZCIT.
  reference: Zebiak, S. E. (1993). Air-sea interaction in the equatorial Atlantic
    region. Journal of Climate, 6(8), 1567-1586.
  doi: 10.1175/1520-0442(1993)006<1567:AIITER>2.0.CO;2
NAtl:
  name: North Atlantic SST Anomaly
  acronym: NAtl
  institution: NOAA Climate Prediction Center (CPC)
  url: https://www.cpc.ncep.noaa.gov/data/indices/sstoi.atl.indices
  filename_csv: dataNAtl.csv
  filename_txt: dataSSTOI.txt
  format: monthly_composite
  region: Atlántico Norte Tropical (5°N-20°N, 60°W-20°W)
  variable: Anomalía mensual de Temperatura Superficial del Mar (°C)
  variable_type: anomalía
  variable_column: ANOM_NAtl (Columna de anomalía extraída de sstoi.atl.indices)
  exact_variable_used: Anomalía mensual observada de TSM (°C)
  units: °C
  period_start: 1982
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.4
  description: Anomalía térmica en la Región de Desarrollo Principal (MDR) de huracanes
    del Atlántico Norte. Correlaciona fuertemente con la temporada de lluvias de Centroamérica.
  reference: Goldenberg, S. B., & Shapiro, L. J. (1996). Physical mechanisms for the
    observed vertical wind shear anomalies in the Atlantic hurricane basin. J. Climate,
    9(6), 1169-1187.
  doi: 10.1175/1520-0442(1996)009<1169:PMFTOV>2.0.CO;2
CAR:
  name: Caribbean SST Index
  acronym: CAR
  institution: NOAA Physical Sciences Laboratory (PSL)
  url: https://psl.noaa.gov/data/correlation/CAR_ersst.data
  filename_csv: dataCAR.csv
  filename_txt: dataCAR.txt
  format: monthly_matrix
  region: Mar Caribe (10°N a 22°N, 85°W a 60°W)
  variable: Anomalía de Temperatura Superficial del Mar ERSST (°C)
  variable_type: anomalía
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Anomalía promedio mensual de TSM en el Mar Caribe (°C)
  units: °C
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.3
  description: Anomalía térmica en la cuenca del Mar Caribe. Fuente primaria de humedad
    y calor latente que modula la intensidad del Chorro de Bajos Niveles del Caribe
    (CLLJ) y la canícula.
  reference: Taylor, M. A., Enfield, D. B., & Chen, A. A. (2002). Influence of the
    tropical Atlantic versus the tropical Pacific on Caribbean rainfall. J. Geophys.
    Res., 107(C9), 3127.
  doi: 10.1029/2001JC001097
WHWP:
  name: Western Hemisphere Warm Pool
  acronym: WHWP
  institution: NOAA Physical Sciences Laboratory (PSL)
  url: https://psl.noaa.gov/data/correlation/whwp.data
  filename_csv: dataWHWP.csv
  filename_txt: dataWHWP.txt
  format: monthly_matrix
  region: Piscina Cálida del Hemisferio Occidental (Pacífico Oriental + Caribe + Golfo
    de México)
  variable: Extensión superficial de agua con TSM > 28.5 °C (10^6 km^2)
  variable_type: anomalía
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Anomalía del área de la piscina cálida (10^6 km²)
  units: 10^6 km^2
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.99
  threshold_r: 0.6
  threshold_mad: 0.4
  description: Superficie oceánica con temperaturas superiores a 28.5 °C en el Pacífico
    Oriental y Atlántico Tropical. Es la segunda piscina cálida más grande del planeta.
  reference: Wang, C., & Enfield, D. B. (2001). The tropical Western Hemisphere warm
    pool. Geophysical Research Letters, 28(8), 1635-1638.
  doi: 10.1029/2000GL011763
PNA:
  name: Pacific-North American Pattern
  acronym: PNA
  institution: NOAA Climate Prediction Center (CPC) / PSL
  url: https://psl.noaa.gov/data/correlation/pna.data
  filename_csv: dataPNA.csv
  filename_txt: dataPNA.txt
  format: monthly_matrix
  region: Pacífico Norte y Norteamérica (20°N a 70°N)
  variable: Patrón de teleconexión de geopotencial en 500 hPa
  variable_type: índice estandarizado
  variable_column: ENE..DIC (Matriz mensual)
  exact_variable_used: Índice de teleconexión estandarizado PNA (adimensional)
  units: Estandarizado
  period_start: 1950
  update_frequency: Mensual
  missing_value: -99.9
  threshold_r: 0.5
  threshold_mad: 0.7
  description: Patrón de ondas planetarias en la troposfera media sobre el Pacífico
    y América del Norte. Modula la intensidad de dorsales y vaguadas que inducen empujes
    fríos hacia Centroamérica.
  reference: Wallace, J. M., & Gutzler, D. S. (1981). Teleconnections in the geopotential
    height field during the Northern Hemisphere winter. Monthly Weather Review, 109(4),
    784-812.
