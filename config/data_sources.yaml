# ==============================================================================
# MANIFIESTO DE FUENTES DE DATOS CLIMÁTICAS (AANALOGOS)
# ==============================================================================

AMO:
  name: "Atlantic Multidecadal Oscillation (Kaplan SST)"
  acronym: "AMO"
  institution: "NOAA Physical Sciences Laboratory (PSL)"
  url: "https://psl.noaa.gov/data/correlation/amon.us.data"
  filename_csv: "dataAMO.csv"
  filename_txt: "dataAMO.txt"
  format: "monthly_matrix"
  region: "Atlántico Norte (0° a 70°N)"
  variable: "Anomalía de Temperatura Superficial del Mar (°C)"
  units: "°C"
  period_start: 1950
  update_frequency: "Mensual"
  missing_value: -99.99
  threshold_r: 0.60
  threshold_mad: 0.60

AO:
  name: "Arctic Oscillation"
  acronym: "AO"
  institution: "NOAA Climate Prediction Center (CPC)"
  url: "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/monthly.ao.index.b50.current.ascii.table"
  filename_csv: "dataAO.csv"
  filename_txt: "dataAO.txt"
  format: "monthly_matrix"
  region: "Ártico / Hemisferio Norte (20°N a 90°N)"
  variable: "Anomalía de Geopotencial en 1000 hPa"
  units: "Estandarizado"
  period_start: 1950
  update_frequency: "Mensual"
  missing_value: -999.0
  threshold_r: 0.60
  threshold_mad: 0.60

